name: Build & Release

# Pull requests: lint, build the universal app, run the tests and check the packaged app + installer.
# Every push to main (i.e. every merge): the same, then sign, prove the in-app updater accepts it, and publish.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Releases queue one at a time; superseded PR runs are cancelled.
  group: ${{ github.event_name == 'push' && 'release' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Read-only by default; only the release job can write (and only it sees the signing key).
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck install.sh scripts/*.sh

  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version

      - name: Test
        # AudioSystemTests need real audio hardware, which hosted runners don't have.
        run: swift test --skip AudioSystemTests

      - name: Choose version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$IS_RELEASE" == "true" ]]; then
            version="$(scripts/release-version.sh)"
            if gh release view "v$version" >/dev/null 2>&1; then
              echo "::error::Release v$version already exists"; exit 1
            fi
          else
            version="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          fi
          echo "Version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build universal app
        env:
          VERSION: ${{ env.IS_RELEASE == 'true' && steps.version.outputs.version || '' }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-app.sh --release

      - name: Verify packaged app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/verify-release.sh build/Equinox-macos.zip "$VERSION"

      - name: Test the installer
        # Pipes install.sh into bash like users do, against the archive we just built.
        run: |
          set -o pipefail
          dir="$RUNNER_TEMP/install-test"
          mkdir -p "$dir"   # install.sh falls back to ~/Applications if the directory isn't writable
          export EQUINOX_INSTALL_DIR="$dir" EQUINOX_NO_LAUNCH=1
          EQUINOX_DOWNLOAD_URL="file://$PWD/build/Equinox-macos.zip" bash < install.sh | tee install.log
          if grep -q "building from source" install.log; then echo "::error::install.sh didn't use the archive"; exit 1; fi
          ditto -x -k build/Equinox-macos.zip "$RUNNER_TEMP/expected"
          diff -r "$RUNNER_TEMP/expected/Equinox.app" "$dir/Equinox.app"
          bash -s -- --uninstall < install.sh
          if [[ -e "$dir/Equinox.app" ]]; then echo "::error::--uninstall left the app behind"; exit 1; fi

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Equinox-macos
          path: build/Equinox-macos.zip
          retention-days: 7

  release:
    needs: [lint, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 20
    environment: production
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - uses: actions/download-artifact@v7
        with:
          name: Equinox-macos
          path: build

      - name: Sign
        env:
          EQUINOX_SIGNING_KEY: ${{ secrets.EQUINOX_RELEASE_SIGNING_KEY }}
        run: |
          if [[ -z "$EQUINOX_SIGNING_KEY" ]]; then echo "::error::Set the EQUINOX_RELEASE_SIGNING_KEY secret."; exit 1; fi
          swift scripts/sign-release.swift build/Equinox-macos.zip

      - name: Verify the updater accepts it
        run: REQUIRE_SIGNATURE=1 scripts/verify-release.sh build/Equinox-macos.zip "$VERSION"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sum="$(shasum -a 256 build/Equinox-macos.zip | cut -d' ' -f1)"
          {
            echo "**Install or update**"
            echo '```sh'
            echo 'curl -fsSL https://raw.githubusercontent.com/north-built-labs/equinox/main/install.sh | bash'
            echo '```'
            echo "Already installed? Equinox offers this update in **Settings → Updates**."
            echo
            echo "Universal (Apple silicon + Intel), macOS 15+. \`Equinox-macos.zip\` SHA-256: \`$sum\`"
          } > notes.md
          gh release create "v$VERSION" build/Equinox-macos.zip build/Equinox-macos.zip.sig \
            --title "Equinox $VERSION" --target "$GITHUB_SHA" --notes-file notes.md --generate-notes
