name: Build & Release

# Pull requests: lint, build the universal app, run the tests and check the packaged app + installer.
# Documentation-only changes skip macOS jobs and publishing; lint and CI always run.
# Other pushes to main: validate, then sign, verify the updater, and publish.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  merge_group:
  schedule:
    - cron: "23 6 * * 1"

concurrency:
  # Releases queue one at a time; superseded PR runs are cancelled.
  group: ${{ github.event_name == 'push' && 'release' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Read-only by default; only the release job can write (and only it sees the signing key).
# Actions are pinned to commit SHAs; Dependabot (.github/dependabot.yml) proposes updates.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      validate: ${{ steps.paths.outputs.validate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changes requiring macOS validation
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Scheduled, manual and merge-queue runs always validate everything.
          validate=true
          if [[ "$EVENT" == pull_request || "$EVENT" == push ]]; then
            if [[ "$EVENT" == pull_request ]]; then
              range="$BASE...$HEAD"
            else
              range="$BASE..$HEAD"
            fi
            # Missing history or a failed diff must never skip validation.
            # Disable rename detection so moves out of code retain their old path.
            if git diff --no-renames --name-only -z "$range" -- > "$RUNNER_TEMP/changed-paths"; then
              validate=false
              while IFS= read -r -d '' path; do
                case "$path" in
                  docs/*|AGENTS.md|CLAUDE.md|README.md|CONTRIBUTING.md|CHANGELOG.md|LICENSE|.github/pull_request_template.md|.github/ISSUE_TEMPLATE/*) ;;
                  *) validate=true; break ;;
                esac
              done < "$RUNNER_TEMP/changed-paths"
            fi
          fi
          echo "validate=$validate" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
      - name: ShellCheck
        run: shellcheck install.sh scripts/*.sh

  test:
    needs: changes
    if: needs.changes.outputs.validate == 'true'
    name: Test (${{ matrix.os }}, ${{ matrix.configuration }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m
      - name: Test
        # Keep hardware-independent AudioSystem validation in CI.
        run: |
          mkdir -p test-results
          swift test -c "${{ matrix.configuration }}" --skip 'AudioSystemTests.test(Lists|Resolves)' \
            --xunit-output test-results/results.xml 2>&1 | tee test-results/test.log
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}-${{ matrix.configuration }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  memory-safety:
    needs: changes
    if: needs.changes.outputs.validate == 'true'
    name: DSP Address Sanitizer
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test DSP with Address Sanitizer
        run: |
          mkdir -p test-results
          swift test --sanitize address --filter EquinoxDSPTests \
            --xunit-output test-results/results.xml 2>&1 | tee test-results/test.log
      - name: Upload sanitizer results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: address-sanitizer
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  build:
    needs: changes
    if: needs.changes.outputs.validate == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test release version selection
        run: bash scripts/test-release-version.sh

      - name: Choose version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$IS_RELEASE" == "true" ]]; then
            version="$(scripts/release-version.sh)"
            if gh release view "v$version" >/dev/null 2>&1; then
              echo "::error::Release v$version already exists"; exit 1
            fi
          else
            version="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          fi
          echo "Version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build universal app
        env:
          VERSION: ${{ env.IS_RELEASE == 'true' && steps.version.outputs.version || '' }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-app.sh --release

      - name: Verify packaged app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/verify-release.sh build/Equinox-macos.zip "$VERSION"

      - name: Test the installer
        # Pipes install.sh into bash like users do, against the archive we just built, signed with a throwaway key
        # (the release key only exists in the release job). A tampered archive must be refused.
        run: |
          set -o pipefail
          key="$RUNNER_TEMP/test-key"
          ssh-keygen -q -t ed25519 -N '' -f "$key"
          echo "equinox-release namespaces=\"equinox-release\" $(cut -d' ' -f1,2 "$key.pub")" > "$RUNNER_TEMP/allowed_signers"
          mkdir -p "$RUNNER_TEMP/signed" "$RUNNER_TEMP/tampered"
          cp build/Equinox-macos.zip "$RUNNER_TEMP/signed/"
          ssh-keygen -q -Y sign -f "$key" -n equinox-release "$RUNNER_TEMP/signed/Equinox-macos.zip"
          mv "$RUNNER_TEMP/signed/Equinox-macos.zip.sig" "$RUNNER_TEMP/signed/Equinox-macos.zip.sshsig"
          cp "$RUNNER_TEMP/signed/"* "$RUNNER_TEMP/tampered/"
          printf 'x' >> "$RUNNER_TEMP/tampered/Equinox-macos.zip"

          dir="$RUNNER_TEMP/install-test"
          mkdir -p "$dir"   # install.sh falls back to ~/Applications if the directory isn't writable
          export EQUINOX_INSTALL_DIR="$dir" EQUINOX_NO_LAUNCH=1 EQUINOX_ALLOWED_SIGNERS="$RUNNER_TEMP/allowed_signers"

          if EQUINOX_DOWNLOAD_URL="file://$RUNNER_TEMP/tampered/Equinox-macos.zip" bash < install.sh; then
            echo "::error::install.sh installed a tampered archive"; exit 1
          fi
          if [[ -e "$dir/Equinox.app" ]]; then echo "::error::install.sh left a tampered app behind"; exit 1; fi

          EQUINOX_DOWNLOAD_URL="file://$RUNNER_TEMP/signed/Equinox-macos.zip" bash < install.sh | tee install.log
          if grep -q "building from source" install.log; then echo "::error::install.sh didn't use the archive"; exit 1; fi
          grep -q "Signature verified" install.log || { echo "::error::install.sh didn't verify the signature"; exit 1; }
          ditto -x -k build/Equinox-macos.zip "$RUNNER_TEMP/expected"
          diff -r "$RUNNER_TEMP/expected/Equinox.app" "$dir/Equinox.app"

          # Failed updates must leave the installed app byte-for-byte intact.
          mkdir -p "$RUNNER_TEMP/unsigned"
          cp build/Equinox-macos.zip "$RUNNER_TEMP/unsigned/"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/wrong-key"
          echo "equinox-release namespaces=\"equinox-release\" $(cut -d' ' -f1,2 "$RUNNER_TEMP/wrong-key.pub")" > "$RUNNER_TEMP/wrong-signers"
          for scenario in tampered unsigned wrong-key; do
            url="file://$RUNNER_TEMP/$scenario/Equinox-macos.zip"
            signers="$RUNNER_TEMP/allowed_signers"
            if [[ "$scenario" == wrong-key ]]; then
              url="file://$RUNNER_TEMP/signed/Equinox-macos.zip"
              signers="$RUNNER_TEMP/wrong-signers"
            fi
            if EQUINOX_DOWNLOAD_URL="$url" EQUINOX_ALLOWED_SIGNERS="$signers" bash < install.sh; then
              echo "::error::install.sh accepted $scenario"; exit 1
            fi
            diff -r "$RUNNER_TEMP/expected/Equinox.app" "$dir/Equinox.app"
          done
          bash -s -- --uninstall < install.sh
          if [[ -e "$dir/Equinox.app" ]]; then echo "::error::--uninstall left the app behind"; exit 1; fi

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Equinox-macos
          path: build/Equinox-macos.zip
          retention-days: 7
          if-no-files-found: error

  ci:
    name: CI
    if: ${{ always() }}
    needs: [changes, lint, test, memory-safety, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable validation job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          VALIDATE: ${{ needs.changes.outputs.validate }}
        run: |
          echo "$RESULTS" | jq -e --arg validate "$VALIDATE" '
            .changes.result == "success" and .lint.result == "success" and
            (if $validate == "true" then
               [.test, .["memory-safety"], .build] | all(.result == "success")
             elif $validate == "false" then
               [.test, .["memory-safety"], .build] | all(.result == "skipped")
             else false end)'

  release:
    needs: [ci, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 20
    # Limited to main and gated on a required reviewer: a merge waits for approval before anything is signed.
    environment: production
    permissions:
      contents: write
      id-token: write       # build provenance attestation
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the updater check runs the published app; keep the write token out of .git/config

      - name: Toolchain
        run: xcodebuild -version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Equinox-macos
          path: build

      - name: Download the published release
        # The app users have installed right now; this release must be an update it accepts.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An API/download failure must not silently bypass the upgrade check.
          # Paginate so draft/prerelease entries cannot hide an older stable release.
          tag="$(scripts/latest-release-tag.sh)"
          if [[ -n "$tag" ]]; then
            gh release download "$tag" --pattern Equinox-macos.zip --dir build/previous
            echo "PREVIOUS_ZIP=$PWD/build/previous/Equinox-macos.zip" >> "$GITHUB_ENV"
          else
            echo "No published stable release yet; verifying against a version-stamped copy of this build."
          fi

      - name: Sign
        env:
          # Release key, a production environment secret. Its public half must be the one embedded in this build.
          EQUINOX_SIGNING_KEY: ${{ secrets.EQUINOX_SIGNING_KEY }}
          # During a key rotation only (production environment secret): the retired key, still trusted by installed
          # copies. Delete the secret once the first release embedding the new public key is out.
          EQUINOX_PREVIOUS_SIGNING_KEY: ${{ secrets.EQUINOX_PREVIOUS_SIGNING_KEY }}
        # Only signs; nothing downloaded is ever run while the keys are in the environment.
        run: |
          if [[ -z "$EQUINOX_SIGNING_KEY" ]]; then echo "::error::Set the EQUINOX_SIGNING_KEY secret on the production environment."; exit 1; fi
          swift scripts/sign-release.swift build/Equinox-macos.zip
          if [[ -n "$EQUINOX_PREVIOUS_SIGNING_KEY" ]]; then
            mkdir -p build/rotation
            cp build/Equinox-macos.zip build/rotation/
            EQUINOX_SIGNING_KEY="$EQUINOX_PREVIOUS_SIGNING_KEY" swift scripts/sign-release.swift --any-key build/rotation/Equinox-macos.zip
          fi

      - name: Verify the updater accepts it
        # No secrets here. The previous key's signature is only used when the published release doesn't embed the
        # current key (a rotation release); any other failure fails the release.
        run: |
          if ! REQUIRE_SIGNATURE=1 scripts/verify-release.sh build/Equinox-macos.zip "$VERSION"; then
            [[ -f build/rotation/Equinox-macos.zip.sig && -n "${PREVIOUS_ZIP:-}" ]] || exit 1
            key="$(sed -nE 's/.*releasePublicKey = Data\(base64Encoded: "([^"]+)"\).*/\1/p' Sources/EquinoxCore/Updates.swift)"
            if unzip -p "$PREVIOUS_ZIP" Equinox.app/Contents/MacOS/Equinox | grep -aF "$key" >/dev/null; then
              echo "::error::The published release already trusts the current key, so this isn't a rotation; not falling back to the previous key."
              exit 1
            fi
            echo "::warning::The published release doesn't trust the current key yet; using the previous key's signatures for this key-rotation release."
            cp build/rotation/Equinox-macos.zip.sig build/rotation/Equinox-macos.zip.sshsig build/
            REQUIRE_SIGNATURE=1 scripts/verify-release.sh build/Equinox-macos.zip "$VERSION"
          fi

      - name: Attest build provenance
        # Lets anyone check an archive came from this workflow: gh attestation verify Equinox-macos.zip -R north-built-labs/equinox
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/Equinox-macos.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sum="$(shasum -a 256 build/Equinox-macos.zip | cut -d' ' -f1)"
          {
            echo "**Install or update**"
            echo '```sh'
            echo 'curl -fsSL https://raw.githubusercontent.com/north-built-labs/equinox/main/install.sh | bash'
            echo '```'
            echo "Already installed? Equinox offers this update in **Settings → Updates**."
            echo
            echo "Universal (Apple silicon + Intel), macOS 15+. \`Equinox-macos.zip\` SHA-256: \`$sum\`"
            echo
            echo "Verify provenance: \`gh attestation verify Equinox-macos.zip -R north-built-labs/equinox\`"
          } > notes.md
          gh release create "v$VERSION" build/Equinox-macos.zip build/Equinox-macos.zip.sig build/Equinox-macos.zip.sshsig \
            --title "Equinox $VERSION" --target "$GITHUB_SHA" --notes-file notes.md --generate-notes
